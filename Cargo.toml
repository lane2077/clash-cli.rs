[package]
name = "clash"
version = "0.3.0"
edition = "2024"

[lib]
name = "clash_cli"
path = "src/lib.rs"

[[bin]]
name = "clash"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.31", features = ["derive"] }
dirs = "6.0.0"
flate2 = "1.0.35"
reqwest = { version = "0.12.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.218", features = ["derive"] }
sha2 = "0.10.9"
tar = "0.4.44"
serde_json = "1.0.149"
serde_yaml = "0.9.34"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = "1.0.149"
serde_yaml = "0.9.34"
